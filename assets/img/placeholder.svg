<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27" />
      <stop offset="100%" stop-color="#151b33" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb3640" />
      <stop offset="100%" stop-color="#ff6b6b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb3640" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fb3640" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#f0f8ff" stroke-width="1">
    <path d="M0,50 H800 M0,100 H800 M0,150 H800 M0,200 H800 M0,250 H800 M0,300 H800 M0,350 H800 M0,400 H800 M0,450 H800" />
    <path d="M100,0 V500 M200,0 V500 M300,0 V500 M400,0 V500 M500,0 V500 M600,0 V500 M700,0 V500" />
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="230" r="180" fill="url(#glow)" />

  <!-- Border decor -->
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="#fb3640" stroke-width="1" opacity="0.3" stroke-dasharray="8 8" />

  <!-- Camera / Gallery Icon -->
  <g transform="translate(360, 160)" stroke="url(#accent-grad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="15" width="80" height="60" rx="10" />
    <circle cx="40" cy="45" r="18" />
    <path d="M25,15 L32,5 L48,5 L55,15" />
    <circle cx="62" cy="27" r="3" fill="#fb3640" />
  </g>

  <!-- Text -->
  <text x="400" y="295" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="#f0f8ff">
    NO ESCAPE
  </text>
  <text x="400" y="325" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#fb3640">
    IMAGE À VENIR
  </text>
</svg>
