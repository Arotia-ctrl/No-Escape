<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27" />
      <stop offset="100%" stop-color="#151b33" />
    </linearGradient>
    <linearGradient id="accent-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb3640" />
      <stop offset="100%" stop-color="#ff6b6b" />
    </linearGradient>
  </defs>

  <rect width="300" height="300" fill="url(#avatar-bg)" />
  <circle cx="150" cy="150" r="140" fill="none" stroke="#fb3640" stroke-width="2" opacity="0.4" stroke-dasharray="6 6" />

  <!-- Gamer Silhouette -->
  <g fill="#20294a" stroke="url(#accent-stroke)" stroke-width="2.5" stroke-linejoin="round">
    <!-- Head with headphones -->
    <circle cx="150" cy="105" r="45" />
    <!-- Headphone band -->
    <path d="M102,110 C100,60 200,60 198,110" fill="none" stroke="#fb3640" stroke-width="6" stroke-linecap="round" />
    <!-- Ear cups -->
    <rect x="96" y="95" width="14" height="28" rx="6" fill="#fb3640" stroke="none" />
    <rect x="190" y="95" width="14" height="28" rx="6" fill="#fb3640" stroke="none" />
    <!-- Shoulders -->
    <path d="M70,235 C70,185 110,170 150,170 C190,170 230,185 230,235 Z" />
  </g>

  <!-- Team tag text -->
  <text x="150" y="270" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" letter-spacing="3" fill="#fb3640">
    NO ESCAPE
  </text>
</svg>
